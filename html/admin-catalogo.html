<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Catálogo - San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="bg-white shadow-sm py-2 px-4 d-flex justify-content-between align-items-center">
        <a href="admin.html" class="text-decoration-none fw-bold" style="color: #2b3060;">← Volver al Panel</a>
        <span class="fw-bold fs-5" style="color: #2ec4b6;">Gestión de Catálogo</span>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" style="color: #2b3060;">Productos y Servicios</h2>
            <button class="btn text-white fw-semibold" style="background-color: #2ec4b6;" onclick="abrirCrearCatalogo()">+ Nuevo Item</button>
        </div>

        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover align-middle mb-0">
                <thead class="text-white" style="background-color: #2b3060;">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaCatalogo">
                </tbody>
            </table>
        </div>
    </main>

    <footer class="text-white pt-4 pb-3 mt-auto" style="background-color: #2b3060;">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 Veterinaria San Marcos</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/admin-catalogo.js"></script>
</body>
</html>
