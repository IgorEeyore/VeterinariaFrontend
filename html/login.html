<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="container text-center mt-5 mb-3">
        <a href="../paginaPrincipal.html">
            <img src="../img/logo.png" alt="logo" height="75px" width="200px">
        </a>
    </div>

    <main class="py-2">
        <div class="container">
            <div class="row justify-content-center align-items-center">
                <div class="col-12 col-lg-10">
                    <div class="card card-registro p-4 p-md-5 shadow-sm border-0">
                        <div class="row align-items-center g-4">
                            
                            <div class="col-12 col-lg-6">
                                <h2 class="fw-bold text-secundario mb-1">¡Hola de nuevo!</h2>
                                <p class="text-muted mb-4">Ingresa tus datos para acceder a tu cuenta y revisar tus citas.</p>

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" maxlength="100">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" maxlength="10">
                                </div>

                                <button type="button" onclick="validarLogin()" class="btn btn-custom-primary w-100 py-2 fw-bold fs-5 shadow-sm mb-3">
                                    Iniciar Sesión
                                </button>
                                
                                <div class="text-center">
                                    <span class="small text-muted">¿No tienes cuenta?</span>
                                    <a href="registro.html" class="small fw-bold text-decoration-none ms-1 text-sanmarcos">Regístrate aquí</a>
                                </div>
                            </div>

                            <div class="col-12 col-lg-6 d-none d-lg-block">
                                <div class="img-registro-container">
                                    <img src="../img/seguridad.jpg" alt="Atención veterinaria San Marcos" class="img-fluid rounded-4 shadow-sm">
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/validaciones.js"></script>
</body>

</html>
