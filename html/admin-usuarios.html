<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Usuarios - San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="bg-white shadow-sm py-2 px-4 d-flex justify-content-between align-items-center">
        <a href="admin.html" class="text-decoration-none fw-bold" style="color: #2b3060;">← Volver al Panel</a>
        <span class="fw-bold fs-5" style="color: #2b3060;">Gestión de Usuarios</span>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold" style="color: #2b3060;">Usuarios Registrados</h2>
            <button class="btn text-white fw-semibold" style="background-color: #2b3060;" id="btnAbrirCrear">+ Nuevo Usuario</button>
        </div>

        <div class="table-responsive bg-white rounded shadow-sm">
            <table class="table table-hover align-middle mb-0" id="tablaUsuarios">
                <thead class="text-white" style="background-color: #2b3060;">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Matías Figueroa</td>
                        <td>m.figueroav@duocuc.cl</td>
                        <td><span class="badge" style="background-color: #2b3060;">Admin</span></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-secondary me-1 btn-editar">Editar</button>
                            <button class="btn btn-sm btn-outline-danger btn-eliminar">Eliminar</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Cliente Ejemplo</td>
                        <td>cliente@correo.cl</td>
                        <td><span class="badge bg-secondary">Cliente</span></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-secondary me-1 btn-editar">Editar</button>
                            <button class="btn btn-sm btn-outline-danger btn-eliminar">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Formulario Usuario (Crear / Editar) -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header text-white" style="background-color: #2b3060;">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Agregar Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <input type="hidden" id="editandoId" value="">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="usuarioNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="usuarioCorreo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" id="usuarioPassword" minlength="4" maxlength="10" placeholder="Entre 4 y 10 caracteres">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Rol</label>
                            <select class="form-select" id="usuarioRol" required>
                                <option value="Cliente">Cliente</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn text-white" style="background-color: #2ec4b6;">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-white pt-4 pb-3 mt-auto" style="background-color: #2b3060;">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 Veterinaria San Marcos</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let contadorId = 3;
            let filaActualEditar = null;
            const modalUsuario = new bootstrap.Modal(document.getElementById('modalUsuario'));

            // Abrir Modal para Crear
            document.getElementById('btnAbrirCrear').addEventListener('click', () => {
                filaActualEditar = null;
                document.getElementById('modalTitulo').textContent = 'Agregar Nuevo Usuario';
                document.getElementById('formUsuario').reset();
                document.getElementById('usuarioPassword').required = true;
                modalUsuario.show();
            });

            // Delegación de eventos en la Tabla (Eliminar y Editar)
            document.getElementById('tablaUsuarios').addEventListener('click', (e) => {
                if (e.target.classList.contains('btn-eliminar')) {
                    const fila = e.target.closest('tr');
                    if (confirm('¿Estás seguro de que deseas eliminar este usuario?')) {
                        fila.remove();
                    }
                }

                if (e.target.classList.contains('btn-editar')) {
                    filaActualEditar = e.target.closest('tr');
                    const celdas = filaActualEditar.children;

                    // Cargar los datos actuales de la fila en el formulario
                    document.getElementById('modalTitulo').textContent = 'Editar Usuario';
                    document.getElementById('usuarioNombre').value = celdas[1].textContent.trim();
                    document.getElementById('usuarioCorreo').value = celdas[2].textContent.trim();
                    document.getElementById('usuarioRol').value = celdas[3].textContent.trim().includes('Admin') ? 'Admin' : 'Cliente';
                    document.getElementById('usuarioPassword').value = '';
                    document.getElementById('usuarioPassword').required = false;

                    modalUsuario.show();
                }
            });

            // Procesar Formulario (Crear / Editar)
            document.getElementById('formUsuario').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const nombre = document.getElementById('usuarioNombre').value;
                const correo = document.getElementById('usuarioCorreo').value;
                const password = document.getElementById('usuarioPassword').value;
                const rol = document.getElementById('usuarioRol').value;

                if (password !== "" && (password.length < 4 || password.length > 10)) {
                    alert("La contraseña debe tener entre 4 y 10 caracteres.");
                    return;
                }

                const badgeRol = rol === 'Admin' 
                    ? `<span class="badge" style="background-color: #2b3060;">Admin</span>`
                    : `<span class="badge bg-secondary">Cliente</span>`;

                if (filaActualEditar) {
                    // Actualizar fila existente
                    filaActualEditar.children[1].textContent = nombre;
                    filaActualEditar.children[2].textContent = correo;
                    filaActualEditar.children[3].innerHTML = badgeRol;
                } else {
                    // Crear nueva fila
                    const nuevaFila = `
                        <tr>
                            <td>${contadorId++}</td>
                            <td>${nombre}</td>
                            <td>${correo}</td>
                            <td>${badgeRol}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-secondary me-1 btn-editar">Editar</button>
                                <button class="btn btn-sm btn-outline-danger btn-eliminar">Eliminar</button>
                            </td>
                        </tr>
                    `;
                    document.querySelector('#tablaUsuarios tbody').insertAdjacentHTML('beforeend', nuevaFila);
                }

                modalUsuario.hide();
            });
        });
    </script>
</body>
</html>
