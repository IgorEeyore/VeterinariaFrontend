<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="container text-center mt-5 mb-3">
        <a href="../paginaPrincipal.html">
            <img src="../img/logo.png" alt="logo" height="75px" width="200px">
        </a>
    </div>

    <main class="py-2 mb-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                        
                        <div class="bg-sanmarcos text-white p-4 text-center">
                            <h2 class="fw-bold m-0">Registro de Usuario</h2>
                            <p class="text-white-50 m-0 small mt-1">Completa tus datos para crear una cuenta</p>
                        </div>

                        <div class="card-body p-4 p-md-5 bg-white">
                                
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="rut" class="form-label fw-semibold">RUN (Sin puntos ni guion)</label>
                                    <input type="text" class="form-control" id="rut" placeholder="Ej. 123456789" maxlength="9">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="tipoUsuario" class="form-label fw-semibold">Tipo de Usuario</label>
                                    <select class="form-select" id="tipoUsuario">
                                        <option value="">Seleccione...</option>
                                        <option value="Administrador">Administrador</option>
                                        <option value="Usuario">Usuario o Cliente</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label fw-semibold">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan" maxlength="50">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="apellido" class="form-label fw-semibold">Apellidos</label>
                                    <input type="text" class="form-control" id="apellido" placeholder="Ej. Pérez González" maxlength="100">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" maxlength="100">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de Nacimiento (Opcional)</label>
                                    <input type="date" class="form-control" id="fechaNacimiento">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="region" class="form-label fw-semibold">Región</label>
                                    <select class="form-select" id="region" onchange="cargarComunas()">
                                        <option value="">Seleccione una región</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="comuna" class="form-label fw-semibold">Comuna</label>
                                    <select class="form-select" id="comuna">
                                        <option value="">Seleccione una comuna</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="direccion" class="form-label fw-semibold">Dirección</label>
                                <input type="text" class="form-control" id="direccion" placeholder="Calle, Número, Depto" maxlength="300">
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="terminos">
                                <label class="form-check-label small" for="terminos">
                                    Acepto los <a href="#" class="text-decoration-none fw-bold text-sanmarcos">términos y condiciones</a>.
                                </label>
                            </div>

                            <button type="button" onclick="validarRegistro()" class="btn btn-custom-secondary w-100 py-2 fw-bold fs-5 shadow-sm mb-3">
                                Registrar Cuenta
                            </button>

                            <div class="text-center">
                                <span class="small text-muted">¿Ya tienes cuenta?</span>
                                <a href="login.html" class="small fw-bold text-decoration-none ms-1 text-sanmarcos">Inicia Sesión aquí</a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/validaciones.js"></script>
</body>

</html>
